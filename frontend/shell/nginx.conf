server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta no-existente devuelve index.html
    # (así /portal, /bi, /backoffice, /callback de Keycloak funcionan)
    location / {
        add_header Cache-Control "no-cache" always;          # index.html y rutas: siempre la versión vigente
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # CORS para assets del remoteEntry (Module Federation)
    location ~ \.(js|css|map|json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
}
