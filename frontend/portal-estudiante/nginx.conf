server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # Lo que cambia en cada despliegue con el MISMO nombre: el navegador siempre pregunta si hay versión nueva.
    # (remoteEntry.js lo carga el shell; si quedaba en caché, el shell seguía mostrando el portal viejo)
    location ~ ^/(assets/remoteEntry\.js|index\.html|sw\.js|manifest\.json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # El resto de /assets lleva el hash del contenido en el nombre: puede guardarse para siempre
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
