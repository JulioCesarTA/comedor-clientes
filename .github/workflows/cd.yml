name: cd
# Variable del repositorio: PUBLIC_HOST (IP o dominio público, sin https://)
# Al hacer commit en main: construye la imagen EN EL PC (runner propio, usa el caché de Docker), la sube al registro
# y reinicia el servicio en el clúster EKS de AWS. Requiere el runner encendido (Escritorio\iniciar-runners.bat) y Docker Desktop abierto.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: cd
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: [self-hosted, pc-julio]
    defaults:
      run:
        shell: C:/gitbash/bin/bash.exe --noprofile --norc -e -o pipefail {0}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4
      - name: Docker aislado (cada runner con su propia sesión)
        run: |
          DC="$RUNNER_TEMP/docker"; DCU="$(cygpath -u "$DC")"
          mkdir -p "$DCU" && cp -r ~/.docker/. "$DCU/" 2>/dev/null || true
          [ -f "$DCU/config.json" ] && sed -i '/credsStore/d;/credHelpers/d' "$DCU/config.json" || echo '{}' > "$DCU/config.json"
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      - name: Login en ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin 006419716393.dkr.ecr.us-west-2.amazonaws.com

      - name: Construir y subir las 6 imágenes (en paralelo)
        env:
          H: https://${{ vars.PUBLIC_HOST }}
        run: |
          construir() {  # imagen contexto [build-args...]
            img=$1; ctx=$2; shift 2
            docker build -t 006419716393.dkr.ecr.us-west-2.amazonaws.com/comedor/$img:latest "$@" $ctx && docker push 006419716393.dkr.ecr.us-west-2.amazonaws.com/comedor/$img:latest
          }
          construir api-gateway gateway/api-gateway &
          construir graphql-gateway gateway/graphql-gateway &
          construir backoffice-gestion frontend/backoffice-gestion &
          construir shell frontend/shell --build-arg VITE_KEYCLOAK_URL=$H:8085 --build-arg VITE_API_URL=$H:8080 \
            --build-arg VITE_REMOTE_PORTAL=$H:3002/assets/remoteEntry.js --build-arg "VITE_BACKOFFICE_URL=$H:3001?embedded=1" --build-arg "VITE_BI_URL=$H:3003?embedded=1" &
          construir portal-estudiante frontend/portal-estudiante --build-arg VITE_KEYCLOAK_URL=$H:8085 --build-arg VITE_API_URL=$H:8080 &
          construir inteligencia-negocio frontend/inteligencia-negocio --build-arg NEXT_PUBLIC_KEYCLOAK_URL=$H:8085 --build-arg NEXT_PUBLIC_API_URL=$H:8080 &
          fallos=0; for p in $(jobs -p); do wait $p || fallos=1; done; exit $fallos

      - name: Conectar con el clúster EKS
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/kube.yaml" >> "$GITHUB_ENV"
          KUBECONFIG="$RUNNER_TEMP/kube.yaml" aws eks update-kubeconfig --name comedor

      - name: Reiniciar en EKS
        run: |
          kubectl -n comedor rollout restart deploy/api-gateway
          kubectl -n comedor rollout restart deploy/graphql-gateway
          kubectl -n comedor rollout restart deploy/backoffice-gestion
          kubectl -n comedor rollout restart deploy/shell
          kubectl -n comedor rollout restart deploy/portal-estudiante
          kubectl -n comedor rollout restart deploy/inteligencia-negocio
          kubectl -n comedor rollout status deploy/api-gateway --timeout=600s
          kubectl -n comedor rollout status deploy/graphql-gateway --timeout=600s
          kubectl -n comedor rollout status deploy/backoffice-gestion --timeout=600s
          kubectl -n comedor rollout status deploy/shell --timeout=600s
          kubectl -n comedor rollout status deploy/portal-estudiante --timeout=600s
          kubectl -n comedor rollout status deploy/inteligencia-negocio --timeout=600s
